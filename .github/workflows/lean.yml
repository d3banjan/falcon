name: Lean CI

on:
  push:
    branches: [master]
    paths:
      - 'lean/**'
  pull_request:
    branches: [master]
    paths:
      - 'lean/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build-args: TaintedTypingFramework
