[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "falcon-secure"
version = "1.0.0a1"
description = "Type-stub security gates for pickle-backed deserialization APIs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = [
    "pickle",
    "deserialization",
    "cwe-502",
    "cve",
    "mypy",
    "pyright",
    "type-checking",
    "security",
    "formal-methods",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "tomlkit>=0.11.0",
    "tomli>=1.2.0; python_version < '3.11'",
    "ty>=0.0.33",
    "mypy>=1.13.0",
    "pyright>=1.1.409",
]

[project.urls]
Homepage = "https://d3banjan.github.io/falcon/"
Repository = "https://github.com/d3banjan/falcon"
Issues = "https://github.com/d3banjan/falcon/issues"
Documentation = "https://d3banjan.github.io/falcon/"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.15.12",
    "bandit>=1.9.4",
    "semgrep>=0.112.1",
]

[project.scripts]
falcon-secure = "falcon_secure.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/falcon_secure", "falcon-stubs", "stubs"]

[tool.hatch.build]
include = [
    "src/falcon_secure/**",
    "falcon-stubs/**",
    "stubs/**",
]

# Local checker configuration for the canonical stub overlay.
[tool.mypy]
python_version = "3.11"
strict = true
# Override stdlib stubs — stdlib is always resolved from bundled typeshed,
# but mypy_path takes precedence when set here.
mypy_path = ["stubs"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (venv creation + pip install)",
]

[tool.pyright]
stubPath = "stubs"
typeCheckingMode = "strict"
pythonVersion = "3.11"

[tool.ty.environment]
extra-paths = ["stubs"]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "ruff>=0.15.12",
]
test = [
    "bandit>=1.9.4",
    "semgrep>=0.112.1",
]
